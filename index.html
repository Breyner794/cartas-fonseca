<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colección Fonseca</title>
    <meta
      name="description"
      content="Una colección de cartas presentada como lo que es: piezas que se miran de cerca."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&family=Poppins:wght@400;500;600&display=swap"
    />

    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/holo.css" />
    <link rel="stylesheet" href="src/css/carousel.css" />
    <link rel="stylesheet" href="src/css/detail.css" />
  </head>

  <body>
    <div class="page">
      <header class="page__header">
        <h1 class="page__title" id="collection-title"></h1>
        <p class="page__subtitle" id="collection-subtitle"></p>
      </header>

      <p class="page__error" id="page-error" role="status" hidden></p>

      <section class="carousel" id="carousel" aria-label="Cartas de la colección">
        <div class="carousel__stage" id="carousel-stage"></div>

        <button class="carousel__arrow carousel__arrow--prev" id="carousel-prev" type="button">
          <span class="visually-hidden">Carta anterior</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="carousel__arrow carousel__arrow--next" id="carousel-next" type="button">
          <span class="visually-hidden">Carta siguiente</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <p class="carousel__counter" id="carousel-counter" aria-live="polite"></p>
        <p class="carousel__hint">Abre una carta para leer su ficha</p>
      </section>
    </div>

    <dialog class="detail" id="detail" aria-labelledby="detail-name">
      <div class="detail__bg" id="detail-bg" aria-hidden="true"></div>

      <button class="detail__close" id="detail-close" type="button">
        <span class="visually-hidden">Cerrar la ficha</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>

      <div class="detail__grid">
        <div class="detail__card-col" id="detail-card"></div>

        <div class="detail__info">
          <h2 class="detail__name" id="detail-name"></h2>
          <p class="detail__subtitle" id="detail-subtitle"></p>
          <ul class="detail__tags" id="detail-tags"></ul>
          <dl class="detail__stats" id="detail-stats"></dl>
          <div class="detail__body" id="detail-body"></div>
        </div>
      </div>
    </dialog>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
